name: ci

# 每次推到 main、打开或更新 pull request 时跑 Swift 测试，并把两种发布包打一遍。
# draft pull request 跳过。跳过视为通过，不挡住 required check。

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Swift tests
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
      - name: swift test
        run: swift test --disable-sandbox
      - name: make dist
        run: make dist
      # 发布包拿到别处也要能用：解开之后只有二进制，没有旁边的资源包。
      - name: check the packages
        run: |
          set -euo pipefail
          cd dist
          version="$(plutil -extract CFBundleShortVersionString raw ../Packaging/Info.plist)"
          dmg="Agy-Switcher-v$version-macOS-universal.dmg"
          tarball="agy-cs-v$version-macOS-universal.tar.gz"
          shasum -a 256 -c "$dmg.sha256"
          shasum -a 256 -c "$tarball.sha256"
          mkdir -p unpacked/cli unpacked/app unpacked/mnt
          tar -xzf "$tarball" -C unpacked/cli
          hdiutil attach -quiet -nobrowse -readonly -mountpoint unpacked/mnt "$dmg"
          test "$(readlink unpacked/mnt/Applications)" = /Applications
          ditto "unpacked/mnt/Agy Switcher.app" "unpacked/app/Agy Switcher.app"
          hdiutil detach -quiet unpacked/mnt
          app="unpacked/app/Agy Switcher.app"
          plutil -lint "$app/Contents/Info.plist"
          codesign --verify --strict --verbose=2 "$app"
          codesign --verify --strict --verbose=2 unpacked/cli/agy-cs
          # 记成已经初始化过，help 就不会去读这台机器的钥匙串。
          mkdir -p "$HOME/.agy-cs"
          printf '1\n' > "$HOME/.agy-cs/initialized"
          for binary in unpacked/cli/agy-cs "$app/Contents/MacOS/agy-cs"; do
            lipo -archs "$binary" | grep -w arm64 > /dev/null
            lipo -archs "$binary" | grep -w x86_64 > /dev/null
            "$binary" help | grep "refresh quota" > /dev/null
          done
